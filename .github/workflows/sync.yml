name: Sync Fork
on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync with upstream
        uses: tgymnich/fork-sync@v1.2.1
        with:
          base: main      # Your branch
          head: main      # Parent branch
